<div class="choose-users-box">
  @if (options.showSearch) {
    <mat-form-field class="mat-form-field-fluid " (click)="stopPropagation($event)">
      <input matInput [formControl]="userFilterCtrl" placeholder="Type to search" />
      <mat-icon matPrefix> search</mat-icon>
    </mat-form-field>
  }
  <div class="users-container">
    @for (user of filteredUsers | async; track user) {
      <div class="user-item" (click)="select(user)">
        <label>
          &#64;{{user.username}}
        </label>
        <div>
          <img src="{{user.image}}" alt="">
        </div>
        <div>
          <div>{{ user.hoten }}</div>
          <span>{{ user.tenchucdanh }}</span>
        </div>
      </div>
    }
  </div>
</div>

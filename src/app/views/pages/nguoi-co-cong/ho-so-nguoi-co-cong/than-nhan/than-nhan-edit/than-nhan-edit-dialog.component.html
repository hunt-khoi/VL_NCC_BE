<div class="btn-close-container">
  <button class="btn-close" type="button" mat-mini-fab color="" (click)="close()" [disabled]="disabledBtn" title="Đóng">
    <mat-icon>clear</mat-icon>
  </button>
</div>
<div class="kt-portlet" [ngClass]="{ 'kt-portlet--body-progress' : viewLoading, 'kt-portlet--body-progress-overlay' : loadingAfterSubmit }">
  <div class="kt-portlet__head kt-portlet__head__custom">
    <div class="col-md-{{item.Id === 0 ? (isZoomSize ? '7' : '5') : (isZoomSize ? '9' : '7')}} kt-margin-bottom-10-mobile" style="margin-top: 20px;">
      <h3 class="kt-portlet__head-title">{{getTitle()}}</h3>
    </div>
    @if (allowEdit) {
      <div class="col-md-{{item.Id === 0 ? (isZoomSize ? '5' : '7') : (isZoomSize ? '3' : '5')}} kt-margin-bottom-10-mobile"
        style="margin-top: 10px; text-align: right;">
        <button type="button" mat-raised-button color="accent" (click)="onSubmit(true)" [disabled]="disabledBtn"
          matTooltip="{{'COMMON.LUU_DONG' | translate}}">
          <span translate="COMMON.LUU_DONG"></span>&nbsp;&nbsp;
          @if (disabledBtn) {
            <div class="spinner-button-pad"></div>
          }
        </button>
        @if (item.Id === 0) {
          <button type="button" mat-raised-button color="primary" (click)="onSubmit(false)" [disabled]="disabledBtn"
            matTooltip="{{'COMMON.LUU_TIEPTUC' | translate}}" class="hide-view-sm">
            <span translate="COMMON.LUU_TIEPTUC"></span>&nbsp;&nbsp;
            @if (disabledBtn) {
              <div class="spinner-button-pad"></div>
            }
          </button>
        }
      </div>
    }
  </div>
  <div class="kt-portlet__body">
    <lib-dynamic-component [childComponentType]="childComponentType" [data]="childComponentData" (getInstance)="getInstance($event)">
    </lib-dynamic-component>
  </div>
</div>

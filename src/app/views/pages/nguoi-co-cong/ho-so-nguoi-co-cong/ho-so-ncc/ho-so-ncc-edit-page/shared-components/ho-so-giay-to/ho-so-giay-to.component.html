<div [formGroup]="parentForm">
	<div class="row">
		<div class="col-md-6 kt-margin-bottom-10-mobile">
			<dl-image-control formControlName="fileDinhKem" nameButton="Chọn file hồ sơ đính kèm"
				[multiple]="false" [disabled]="false">
			</dl-image-control>
		</div>
	</div>
	<div class="form-group kt-form__group row" *ngIf="isBangTQ">
		<!--9. bằng tổ quốc ghi công-->
		<div class="col-lg-12 m--margin-bottom-20-mobile">
			<h4 style="border-bottom: solid 1px;color: #5867dd;">
				Thông tin bằng tổ quốc ghi công
			</h4>
		</div>
		<div class="col-lg-3 m--margin-bottom-20-mobile">
			<mat-form-field class="mat-form-field-fluid">
				<input matInput placeholder="Bẳng tổ quốc ghi công" formControlName="GiayTo9" class="require"
					required />
			</mat-form-field>
		</div>
		<div class="col-lg-3 m--margin-bottom-20-mobile">
			<mat-form-field class="mat-form-field-fluid">
				<input matInput placeholder="Số quyết định" formControlName="So9" class="require" required />
			</mat-form-field>
		</div>
		<div class="col-lg-3 m--margin-bottom-20-mobile">
			<mat-form-field class="mat-form-field-fluid">
				<input matInput placeholder="Ngày cấp" formControlName="NgayCap9" type="text"
					[matDatepicker]="pickerG9" class="require" required>
				<mat-datepicker-toggle matSuffix [for]="pickerG9"></mat-datepicker-toggle>
				<mat-datepicker #pickerG9></mat-datepicker>
			</mat-form-field>
		</div>
		<div class="col-lg-3 m--margin-bottom-20-mobile">
			<mat-form-field class="mat-form-field-fluid">
				<input matInput placeholder="Nơi cấp" formControlName="NoiCap9" />
			</mat-form-field>
		</div>
	</div>
	<div class="row" *ngIf="GiayTos.length > 0">
		<div class="col-lg-12 m--margin-bottom-20-mobile">
			<h4 style="border-bottom: solid 1px;color: #5867dd;">
				Các giấy tờ cần thiết
			</h4>
		</div>
		<div class="col-lg-12 m--margin-bottom-20-mobile">
			<table style="width:100%" class="table-bordered">
				<tr>
					<th class="text-center">Loại giấy tờ</th>
					<th class="text-center">Số</th>
					<th class="text-center">Nơi cấp</th>
					<th class="text-center">Ngày cấp</th>
					<th class="text-center" style=" max-width: 70px;">Tệp đính kèm</th>
				</tr>
				<tr *ngFor="let loai of GiayTos; let i=index">
					<td>{{loai.GiayTo}}
						<span style="color: red; font-weight: bold;" *ngIf="loai.IsRequired"
							title="Bắt buộc nhập">*</span>
					</td>
					<td>
						<mat-form-field class="mat-form-field-fluid ">
							<input matInput [(ngModel)]="loai.So" [ngModelOptions]="{standalone: true}"
								style="text-transform:uppercase" />
						</mat-form-field>
					</td>
					<td>
						<mat-form-field class="mat-form-field-fluid ">
							<input matInput [(ngModel)]="loai.NoiCap" [ngModelOptions]="{standalone: true}" />
						</mat-form-field>
					</td>
					<td>
						<mat-form-field class="mat-form-field-fluid ">
							<input matInput [(ngModel)]="loai.NgayCap" type="text" [matDatepicker]="pickerN1"
								[ngModelOptions]="{standalone: true}">
							<mat-datepicker-toggle matSuffix [for]="pickerN1"></mat-datepicker-toggle>
							<mat-datepicker #pickerN1></mat-datepicker>
						</mat-form-field>
					</td>
					<td class="text-center">
						<dl-image-control [(ngModel)]="loai.FileDinhKem" nameButton="Chọn tệp"
							[multiple]="false" [disabled]="!allowEdit" [ngModelOptions]="{standalone: true}">
						</dl-image-control>
					</td>
				</tr>
			</table>
		</div>
	</div>
</div>

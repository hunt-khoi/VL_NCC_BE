<style>
	.mat-row.error td {
		color: red;
	}
</style>
<kt-portlet>
	<kt-portlet-header [sticky]="true" [title]="'Quá trình duyệt'" [class]="'kt-portlet__head--lg'" [viewLoading$]="dataSource.loading$">
		<ng-container ktPortletTools>
			<kt-column-option [gridService]="gridService"></kt-column-option>
		</ng-container>
	</kt-portlet-header>

	<kt-portlet-body>
		<div class="kt-form">
			<div class="kt-form__filtration">
				<div class="row align-items-center">
					<div class="col-md-3 kt-margin-bottom-10-mobile">
						<mat-form-field class="mat-form-field-fluid">
							<mat-select placeholder="Loại phiếu" [(ngModel)]="selectedLoai" (selectionChange)="loadList()">
								<mat-option value="" selected disabled>Chọn loại phiếu</mat-option>
								<mat-option *ngFor="let opt of listLoai" value="{{opt.id}}">{{opt.title}}</mat-option>
							</mat-select>
						</mat-form-field>
					</div>
					<div class="col-md-3 kt-margin-bottom-10-mobile">
						<mat-checkbox [(ngModel)]="trangthaiduyet" (change)="loadList()">Không tìm thấy người duyệt</mat-checkbox>
					</div>
				</div>
			</div>
		</div>
		<div class="mat-table__wrapper d-block" [ngStyle]="{'overflow-x': gridService.model.haveFilter?'unset':'auto'}">
			<table mat-table class="lmat-elevation-z8" [ngClass]="{'dl-table-flt': gridService.model.haveFilter}" #table [dataSource]="dataSource" 
				matSort #sort1="matSort" matSortActive="so_phieu" matSortDirection="asc" matSortDisableClear cdkDropListGroup>
				<ng-container matColumnDef="#">
					<th mat-header-cell *matHeaderCellDef class="stt-cell" style="width:100px">STT</th>
					<td mat-cell *matCellDef="let i=index" class="stt-cell">{{i + 1}}</td>
				</ng-container>
				<ng-container matColumnDef="ten_phieu">
					<th mat-header-cell *matHeaderCellDef>
						<kt-column-filter [gridService]="gridService" enable_sort="true" column_name="ten_phieu" column_title="Tên phiếu"></kt-column-filter>
					</th>
					<td mat-cell *matCellDef="let item">{{item.ten_phieu}}</td>
				</ng-container>
				<ng-container matColumnDef="so_phieu">
					<th mat-header-cell *matHeaderCellDef>
						<kt-column-filter [gridService]="gridService" enable_sort="true" column_name="so_phieu" column_title="Số phiếu"></kt-column-filter>
					</th>
					<td mat-cell *matCellDef="let item">{{item.so_phieu}}</td>
				</ng-container>
				<ng-container matColumnDef="ngay_tao">
					<th mat-header-cell *matHeaderCellDef mat-sort-header>Ngày gửi</th>
					<td mat-cell class="m--padding-10" *matCellDef="let item">{{item.ngay_tao}}</td>
				</ng-container>
				<ng-container matColumnDef="nguoi_tao">
					<th mat-header-cell *matHeaderCellDef>
						<kt-column-filter [gridService]="gridService" enable_sort="true" column_name="nguoi_tao" column_title="Người gửi"></kt-column-filter>
					</th>
					<td mat-cell class="m--padding-10" *matCellDef="let item">{{item.nguoi_tao}}</td>
				</ng-container>
				<ng-container matColumnDef="checker">
					<th mat-header-cell *matHeaderCellDef>Người xử lý</th>
					<td mat-cell class="m--padding-10" *matCellDef="let item">{{item.checker.strChecker}}</td>
				</ng-container>
				<ng-container matColumnDef="tinh_trang">
					<th mat-header-cell *matHeaderCellDef>
						<kt-column-filter [gridService]="gridService" enable_sort="true" column_name="tinh_trang" column_title="Tình trạng"></kt-column-filter>
					</th>
					<td mat-cell class="m--padding-10" *matCellDef="let item">{{item.ten_tinh_trang}}</td>
				</ng-container>
				<ng-container matColumnDef="Deadline">
					<th mat-header-cell *matHeaderCellDef>Thời hạn</th>
					<td mat-cell class="m--padding-10" *matCellDef="let item">{{item.Deadline}}</td>
				</ng-container>

				<ng-container matColumnDef="actions">
					<th mat-header-cell *matHeaderCellDef style="width: 100px;">Thao tác</th>
					<td mat-cell *matCellDef="let item" class="action-cell" [ngClass]="list_button?'list-button':''">
						<button mat-button (click)="edit(item)" [ngClass]="btnClass" *ngIf="dataService.ReadOnlyControl && item.checker.strChecker===''"
						 	matTooltip="Thêm người duyệt" color="primary" type="button">
							<mat-icon>create</mat-icon>
							<span class="button-text">Thêm người duyệt</span>
						</button>
						<button mat-button (click)="edit(item, true)" [ngClass]="btnClass" 
							matTooltip="Thảo luận" color="info" type="button">
							<mat-icon>message</mat-icon>
							<span class="button-text">Thảo luận</span>
						</button>
						<button mat-button (click)="timeline(item)" [ngClass]="btnClass" 
							matTooltip="Xem sơ đồ" color="primary" type="button">
							<mat-icon>timeline</mat-icon>
							<span class="button-text">Sơ đồ</span>
						</button>
					</td>
				</ng-container>
				<tr mat-header-row *matHeaderRowDef="gridService.model.displayedColumns"></tr>
				<tr mat-row *matRowDef="let row; columns: gridService.model.displayedColumns" [ngClass]="{error:row.IsTre}"></tr>
			</table>
			<div class="mat-table__message" *ngIf="!dataSource.hasItems">Không có dữ liệu</div>
		</div>
		
		<div class="mat-table__bottom" [ngClass]="{'exist-flt': gridService.model.haveFilter}">
			<div class="flt-selected" *ngIf="gridService.model.haveFilter">
				<kt-chip-filter [gridService]="gridService"></kt-chip-filter>
			</div>
			<div class="flt-page">
				<mat-spinner [diameter]="20" *ngIf="dataSource.loading$ | async"></mat-spinner>
				<mat-paginator [pageSize]="10" [pageSizeOptions]="gridService.model.pageSize" 
					[length]="dataSource.paginatorTotal$ | async" [showFirstLastButtons]="true">
				</mat-paginator>
			</div>
		</div>
	</kt-portlet-body>
</kt-portlet>

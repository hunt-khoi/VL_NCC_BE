<div class="kt-login__body"
  [ngStyle]="{'background-image': 'url(' + constants.background + ')','background-size':'cover'}">
  <div class="row view-login">
    <div class="col-sm-12 col-md-4 cover-left-info">
      <div class="logo-dv">
        <img src="./assets/images/donvi2.png" alt="{{constants.title}}" title="{{constants.title}}"
          style="max-height: 250px;width: 100%;" />
          <!--<img src="./assets/images/logo.png" alt="Hệ thống CSDL Sở Lao động - Thương bình và Xã hội" title="Hệ thống CSDL Sở Lao động - Thương bình và Xã hội" style="max-height: 100px;">
          <h3 style="color: white;font-size: 40px;"><span style="font-size: 35px;color:#00923f">Hệ thống CSDL</span> Sở Lao động - Thương binh và Xã hội</h3>-->
        </div>
        <div class="static-info">
          <div class="item-info">
            <div class="img-info">
              <img src="./assets/images/phone.png" alt="Hỗ trợ" title="Hỗ trợ" />
            </div>
            <div class="i-text">
              <b>Hỗ trợ</b>
              <div>Điện thoại: <b>{{constants.phone}}</b></div>
              <div>Email: <b>{{constants.email}}</b></div>
            </div>
          </div>
          <div class="item-info">
            <div class="img-info">
              <img src="./assets/images/cert.png" alt="Hỗ trợ" title="Hỗ trợ" />
            </div>
            <div class="i-text">{{constants.license}}</div>
          </div>
        </div>
      </div>
      <div class="col-sm-12 col-md-4">
        <div class="cover-form-login">
          <div class="kt-login__form dl-login-form">
            <!-- <div class="login-logo">
            <img src="{{constants.logo}}" alt="{{constants.title}}" title="{{constants.title}}" style="max-height:100px"/>
          </div> -->
          <h3 class="text-center">ĐĂNG NHẬP</h3>
          @if (expression) {
            <div class="error-message">
              <div class="text-danger"></div>
            </div>
          }
          <kt-auth-notice></kt-auth-notice>
          <form class="kt-form" [formGroup]="itemForm">
            <div class="form-group">
              <input type="text"
                style="background: url(./assets/images/user.png) left 8px center no-repeat #fff;"
                placeholder="{{ 'AUTH.INPUT.USERNAME' | translate }}" formControlName="username"
                autocomplete="off" />
                @if (error_txt.username) {
                  <div class="error-message">{{error_txt.username}}</div>
                }
              </div>
              <div class="form-group">
                <input type="password"
                  style="background: url(./assets/images/lock.png) left 8px center no-repeat #fff;"
                  placeholder="{{ 'AUTH.INPUT.PASSWORD' | translate }}" formControlName="password"
                  autocomplete="off" />
                  @if (error_txt.password) {
                    <div class="error-message">{{error_txt.password}}</div>
                  }
                </div>
                @if (showCaptcha) {
                  <div class="form-group">
                    <re-captcha #recaptcha (captchaResponse)="handleCorrectCaptcha($event)" size="normal"
                    language="vi" [site_key]="YOUR_SITE_KEY"></re-captcha>
                  </div>
                }
                <div>
                  <a href="javascript:;" style="color: black;" routerLink="/auth/forgot-password"
                    class="kt-link kt-login__link-forgot">
                    {{ 'AUTH.GENERAL.FORGOT_BUTTON' | translate }}
                  </a>
                </div>
                <br>
                  <div>
                    <button (click)="submit()"
                      [ngClass]="{'kt-spinner kt-spinner--right kt-spinner--md kt-spinner--light': loading}"
                      id="kt_login_signin_submit" class="btn btn-primary btn-elevate btn-login">
                      {{ 'AUTH.LOGIN.BUTTON' | translate }}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>

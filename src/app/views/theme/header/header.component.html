<!-- begin: Header -->
<div ktHeader #ktHeader class="kt-header kt-grid__item" [ngClass]="htmlClassService.getClasses('header', true)"
  id="kt_header" [ngStyle]="{'background': '#0274b5 url(' + constants.background_header + ') right top no-repeat'}">
  @if ((loader.progress$|async) > 0) {
    <ngb-progressbar class="kt-loading-bar" [value]="loader.progress$|async" height="3px">
    </ngb-progressbar>
  }

  <!-- begin:: Brand -->
  <!-- <kt-brand></kt-brand> -->
  <!-- end:: Brand -->

  <!-- begin: Header Menu -->
  @if (menuHeaderDisplay) {
    <kt-menu-horizontal style="width: 80%;" (getMenuItem)="getActiveHeader($event)">
    </kt-menu-horizontal>
  }
  <!-- end: Header Menu -->

  <!-- begin:: Header Topbar -->
  <!-- empty div to fix topbar to stay on the right when menu-horizontal is hidden -->
  @if (!menuHeaderDisplay) {
    <div></div>
  }
  <kt-topbar style="position: relative;"></kt-topbar>
  <!-- end:: Header Topbar -->
</div>
<!-- end: Header -->

<!-- begin:: Content Submenu Head-->
@if (dataSubmenu) {
  <kt-subheader-tab [fluid]="fluid_sub" [clear]="clear" [data]="dataSubmenu" [menuId]="activeMenu">
  </kt-subheader-tab>
}
<!-- end:: Content Submenu Head -->

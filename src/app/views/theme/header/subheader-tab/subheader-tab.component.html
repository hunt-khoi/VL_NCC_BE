<div (wheel)="onWheel($event)" id="container" class=" kt-subheader kt-grid__item"
  [ngClass]="{'kt-container--clear': clear, 'sub-collapse': collapse}">
  <div class="kt-container" [ngClass]="{'kt-container--fluid': fluid}">
    <div class="kt-subheader__main">
      <div class="group-tab-submenu" >
        <div class="tab-button">
          <button class="button-summary" (click)="collapseSubmenu()">
            <i [ngClass]="collapse?'fa fa-angle-double-down': 'fa fa-angle-double-up'"></i>
          </button>
        </div>
        @for (item of data; track item; let i = $index) {
          <a matBadge="{{item.num}}" [matBadgeHidden]="item.num<=0" [routerLink]="item.page"
            class="tab-submenu num-menu view-pc" matTooltip="{{item.title}}"
            [ngClass]="getItemCssClasses(item)">
            <!--[ngClass]="{'active': i==0}" [ngClass]="getItemCssClasses(item)"-->
            <div [ngClass]="item.icon? item.icon: 'flaticon-layers'" class="icon-menu" aria-hidden="true"></div>
            @if (!collapse) {
              <div class="menu-title">{{item.title}}</div>
            }
            <!-- <div class="num-menu" *ngIf="item.num>0">{{item.num}}</div> -->
            <b class="arrow"></b>
          </a>
        }
        @for (item of data; track item; let i = $index) {
          <a matBadge="{{item.num}}" [matBadgeHidden]="item.num<=0" [routerLink]="item.page"
            class="tab-submenu num-menu view-mobile" matTooltip="{{item.title}}"
            [ngClass]="getItemCssClasses(item)">
            <!--[ngClass]="{'active': i==0}" [ngClass]="getItemCssClasses(item)"-->
            <div [ngClass]="item.icon? item.icon: 'flaticon-layers'" class="icon-menu" aria-hidden="true"></div>
            @if (!collapse) {
              <div class="menu-title">{{item.title}}</div>
            }
            <!-- <div class="num-menu" *ngIf="item.num>0">{{item.num}}</div> -->
            <b class="arrow"></b>
          </a>
        }
      </div>
    </div>
  </div>
</div>
